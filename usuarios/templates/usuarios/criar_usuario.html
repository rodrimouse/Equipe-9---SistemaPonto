{% extends "usuarios/base.html" %}
{% block titulo %}Novo usuário{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina"><div><h1>Novo usuário</h1></div></div>
<div class="cartao cartao-form">
  <form method="POST">
    {% csrf_token %}
    <label class="campo" for="username">Usuário</label><input type="text" name="username" id="username" required>
    <label class="campo" for="email">E-mail</label><input type="email" name="email" id="email" required>
    <label class="campo" for="senha">Senha</label><input type="password" name="senha" id="senha" minlength="6" required autocomplete="new-password">
    <p class="dica">Mínimo de 6 caracteres. A senha é guardada criptografada.</p>
    <label class="campo" for="tipo">Tipo</label>
    <select name="tipo" id="tipo"><option value="funcionario">Funcionário</option></select>
    <div class="rodape-form"><button type="submit" class="btn">Salvar</button><a class="btn btn-sec" href="{% url 'listar_usuarios' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
