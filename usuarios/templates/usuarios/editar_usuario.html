{% extends "usuarios/base.html" %}
{% block titulo %}Editar usuário{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina"><div><h1>Editar usuário</h1></div></div>
<div class="cartao cartao-form">
  <form method="POST">
    {% csrf_token %}
    <label class="campo" for="username">Usuário</label><input type="text" name="username" id="username" value="{{ user.username }}" required>
    <label class="campo" for="email">E-mail</label><input type="email" name="email" id="email" value="{{ user.email }}" required>
    <label class="campo" for="senha">Senha</label><input type="password" name="senha" id="senha" minlength="6" autocomplete="new-password" placeholder="Deixe vazio para manter a atual">
    <p class="dica">A senha é guardada criptografada e não pode ser exibida. Preencha apenas para trocá-la.</p>
    <label class="campo" for="tipo">Tipo</label>
    <select name="tipo" id="tipo">
      <option value="funcionario" {% if user.tipo == 'funcionario' %}selected{% endif %}>Funcionário</option>
      <option value="admin" {% if user.tipo == 'admin' %}selected{% endif %}>Administrador</option>
    </select>
    <div class="rodape-form"><button type="submit" class="btn">Atualizar</button><a class="btn btn-sec" href="{% url 'listar_usuarios' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
